name: History drafts regression
on:
  push:
    branches: [ci/history-drafts-287]
  pull_request:
    branches: [fix/history-drafts-logical-lane]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-drafts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm protobuf-compiler libssl-dev liburing-dev
      - name: Run the patched regression
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release --manifest-path helios/Cargo.toml --features runtime-core,server --lib shared_decoded_history_reaches_copy_and_mtp_uploads_after_response_completion -- --nocapture 2>&1 | tee "$RUNNER_TEMP/history-patched.log"
          grep -Eq 'test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/history-patched.log"
          echo 'Patched: one regression test passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Restore the original packing line and require the specific regression
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("helios/src/model/packing.rs")
          source = path.read_text()
          fixed = "                        lane.tokens.saturating_sub(1),"
          original = "                        frame.step.token_capacity - 1,"
          assert source.count(fixed) == 1
          path.write_text(source.replace(fixed, original, 1))
          PY
          git diff --exit-code -- helios/src/server/runtime/phase_tests.rs
          git diff -- helios/src/model/packing.rs
          if cargo test --locked --release --manifest-path helios/Cargo.toml --features runtime-core,server --lib shared_decoded_history_reaches_copy_and_mtp_uploads_after_response_completion -- --nocapture 2>&1 | tee "$RUNNER_TEMP/history-unpatched.log"; then
            echo "::error::The regression unexpectedly passed without the fix"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          log = (Path(os.environ["RUNNER_TEMP"]) / "history-unpatched.log").read_text()
          source = Path("helios/src/server/runtime/phase_tests.rs").read_text().splitlines()
          line = next(i for i, s in enumerate(source, 1)
                      if s.strip() == 'i32::from_le_bytes(bytes("copy_count").try_into().unwrap()),')
          assert re.search(r"phase_tests\.rs:" + str(line - 1) + r":\d+", log), "Failure did not occur at the copy-count assertion"
          assert re.search(r"left:\s+2\s+right:\s+1", log), "Failure did not report two copies instead of one"
          assert re.search(r"test result: FAILED\. 0 passed; 1 failed;", log)
          PY
          echo 'Unpatched: reproduced the expected failure (two copied drafts uploaded for one logical draft position).' >> "$GITHUB_STEP_SUMMARY"
